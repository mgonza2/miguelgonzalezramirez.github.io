<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Representative spatial and time-series analysis</title>
  <desc id="desc">A sanitized non-project figure combining synthetic spatial markers and a synthetic time-series curve to illustrate the analysis categories used in the Energy AI Hackathon.</desc>
  <rect width="1200" height="700" rx="20" fill="#FBFAF7"/>
  <text x="62" y="56" fill="#65717A" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="1.4">REPRESENTATIVE / SANITIZED — ANALYSIS CATEGORIES ONLY</text>
  <text x="62" y="100" fill="#172129" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="600">Spatial and temporal analysis context</text>
  <g transform="translate(62 142)">
    <rect width="500" height="486" rx="14" fill="#F6F5F1" stroke="#D8D7D2"/>
    <text x="28" y="42" fill="#65717A" font-family="IBM Plex Mono, monospace" font-size="12">GEOSPATIAL ANALYSIS — REPRESENTATIVE</text>
