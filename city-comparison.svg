<svg width="1100" height="650" viewBox="0 0 1100 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Representative comparative location analysis</title>
  <desc id="desc">A sanitized non-project comparison matrix illustrating how multiple business areas might be compared across unnamed location-intelligence dimensions.</desc>
