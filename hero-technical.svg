<svg width="900" height="760" viewBox="0 0 900 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Representative energy data composition</title>
  <desc id="desc">A sanitized technical composition combining representative well-log curves, a subtle geospatial grid, and a data workflow annotation.</desc>
  <rect width="900" height="760" rx="22" fill="#FBFAF7"/>
  <g opacity="0.55" stroke="#D8D7D2">
    <path d="M80 90H820M80 170H820M80 250H820M80 330H820M80 410H820M80 490H820M80 570H820M80 650H820"/>
    <path d="M120 60V700M220 60V700M320 60V700M420 60V700M520 60V700M620 60V700M720 60V700"/>
  </g>
  <g>
    <rect x="74" y="72" width="332" height="556" rx="14" fill="#F6F5F1" stroke="#D8D7D2"/>
    <text x="98" y="107" fill="#65717A" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="1.2">REPRESENTATIVE WELL-LOG VIEW</text>
    <text x="98" y="137" fill="#172129" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="600">Technical data profile</text>
    <g stroke="#D8D7D2">
      <path d="M130 170V590M220 170V590M310 170V590"/>
      <path d="M98 210H380M98 290H380M98 370H380M98 450H380M98 530H380"/>
    </g>
    <path d="M147 172C170 190 128 215 171 238C206 258 159 285 191 309C226 336 184 361 213 390C243 422 194 445 224 474C258 503 222 530 244 557C260 575 251 585 270 590" stroke="#B55B2A" stroke-width="5" stroke-linecap="round"/>
    <path d="M293 172C268 196 318 221 281 246C247 268 300 300 264 324C225 349 286 376 249 407C215 434 266 461 232 486C198 512 245 539 216 566C204 577 217 587 198 590" stroke="#487A76" stroke-width="5" stroke-linecap="round"/>
    <text x="98" y="613" fill="#65717A" font-family="IBM Plex Mono, monospace" font-size="12">SANITIZED / NON-PROJECT DATA</text>
  </g>

  <g>
    <rect x="444" y="72" width="382" height="280" rx="14" fill="#1B2931"/>
    <text x="472" y="108" fill="#E6A37E" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.1">GEOSPATIAL CONTEXT</text>
    <g opacity="0.35" stroke="#8BA09F">
      <path d="M468 150H802M468 205H802M468 260H802M468 315H802"/>
      <path d="M510 130V330M580 130V330M650 130V330M720 130V330M790 130V330"/>
    </g>
    <path d="M490 290C540 245 548 190 617 196C670 201 695 153 753 167" stroke="#487A76" stroke-width="3" stroke-dasharray="6 7"/>
    <g fill="#B55B2A" stroke="#F6F5F1" stroke-width="3">
      <circle cx="505" cy="277" r="8"/><circle cx="557" cy="229" r="8"/><circle cx="616" cy="198" r="8"/><circle cx="681" cy="181" r="8"/><circle cx="751" cy="166" r="8"/>
    </g>
    <text x="472" y="328" fill="#BFCBD0" font-family="IBM Plex Sans, sans-serif" font-size="13">Representative spatial layer — not project locations</text>
  </g>

  <g>
    <rect x="444" y="382" width="382" height="246" rx="14" fill="#F6F5F1" stroke="#D8D7D2"/>
    <text x="472" y="416" fill="#65717A" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.1">DATA WORKFLOW</text>
    <g font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#172129">
      <rect x="472" y="452" width="114" height="58" rx="8" fill="#FFFFFF" stroke="#D8D7D2"/><text x="491" y="487">Raw logs</text>
      <rect x="630" y="452" width="142" height="58" rx="8" fill="#FFFFFF" stroke="#D8D7D2"/><text x="652" y="477">Audit / QA</text><text x="652" y="496" fill="#65717A" font-size="12">Python + SQL</text>
      <path d="M588 481H622" stroke="#B55B2A" stroke-width="2"/><path d="M616 475L623 481L616 487" stroke="#B55B2A" stroke-width="2"/>
      <rect x="472" y="540" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#D8D7D2"/><text x="492" y="575">Structured data</text>
      <rect x="660" y="540" width="112" height="58" rx="8" fill="#FFFFFF" stroke="#D8D7D2"/><text x="676" y="565">Spatial +</text><text x="676" y="584">temporal</text>
      <path d="M622 569H650" stroke="#487A76" stroke-width="2"/><path d="M644 563L651 569L644 575" stroke="#487A76" stroke-width="2"/>
    </g>
  </g>

  <text x="74" y="698" fill="#65717A" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1">REPRESENTATIVE / SANITIZED TECHNICAL GRAPHIC</text>
</svg>
